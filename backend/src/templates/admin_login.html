{% extends "base.html" %}

{% block title %}System Admin Sign In — MediFinder Governance{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="brand-logo justify-content-center mb-2">
            <i class="bi bi-shield-lock text-danger fs-3"></i>
            <span>Medi<strong>Admin</strong></span>
          </div>
          <h4 class="fw-bold">Platform Governance</h4>
          <p class="text-muted small">Access verification queue & audit metrics</p>
        </div>

        <form action="{{ url_for('admin_web.login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">ADMIN USERNAME</label>
            <input type="text" name="username" class="form-control py-2" placeholder="admin" required>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold text-muted">PASSWORD</label>
            <input type="password" name="password" class="form-control py-2" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold mb-3">
            Authenticate Administrator
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
