{% extends "base.html" %}

{% block title %}Error {{ code }} — MediFinder{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
        <h1 class="display-1 fw-bold text-danger">{{ code or 404 }}</h1>
        <h4 class="fw-bold mb-3">Notice</h4>
        <p class="text-muted mb-4">{{ message or "An unexpected issue occurred." }}</p>
        <div>
          <a href="{{ url_for('public_web.index') }}" class="btn btn-primary px-4 fw-semibold">
            <i class="bi bi-house-door me-1"></i> Return Home
          </a>
          <a href="{{ url_for('public_web.search_page') }}" class="btn btn-outline-secondary px-4 ms-2">
            <i class="bi bi-search me-1"></i> Search Medicines
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
