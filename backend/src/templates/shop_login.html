{% extends "base.html" %}

{% block title %}Pharmacy Partner Sign In — MediFinder{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="brand-logo justify-content-center mb-2">
            <i class="bi bi-shop text-primary fs-3"></i>
            <span>Medi<strong>Finder</strong></span>
          </div>
          <h4 class="fw-bold">Pharmacy Portal Login</h4>
          <p class="text-muted small">Manage real-time inventory and process medicine reservations</p>
        </div>

        <form action="{{ url_for('pharmacy_web.login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">REGISTERED EMAIL</label>
            <input type="email" name="email" class="form-control py-2" placeholder="apollo@medifinder.demo" required>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold text-muted">PASSWORD</label>
            <input type="password" name="password" class="form-control py-2" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
            Sign In to Dashboard
          </button>
          <div class="text-center small text-muted">
            New Pharmacy Partner? <a href="{{ url_for('pharmacy_web.register') }}" class="fw-bold">Register your store</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
