version: '3.8'

services:
  # ==========================================
  # MongoDB Scalable Database Service
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: medifinder_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: medifinder
    volumes:
      - mongo_data:/data/db
    networks:
      - medifinder_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # MediFinder Backend API & Web Application
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medifinder_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/medifinder
      - MONGODB_DB_NAME=medifinder
      - SECRET_KEY=prod_super_secret_key_medifinder_2026
      - JWT_SECRET_KEY=prod_jwt_super_secret_key_medifinder_2026
      - ADMIN_USER=admin
      - ADMIN_PASS=Admin@MediFinder2026!
    volumes:
      - upload_data:/app/backend/src/static/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medifinder_network

volumes:
  mongo_data:
    driver: local
  upload_data:
    driver: local

networks:
  medifinder_network:
    driver: bridge
